<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Suite - Professional Visualizer</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --accent: #7000ff;
            --text: #ffffff;
        }
        body { background-color: var(--bg-color); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .visualizer-container { width: 90%; max-width: 1000px; background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); text-align: center; }
        .chat-header { margin-bottom: 20px; }
        .status-indicator { font-size: 0.85rem; color: #4CAF50; display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 5px; }
        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; padding: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 12px; }
        button, select { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #5a00cc; transform: scale(1.05); }
        #visualizerCanvas { width: 100%; height: 400px; background: #000; border-radius: 15px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="visualizer-container">
    <div class="chat-header">
        <h1>AI Асистент</h1>
        <div class="status-indicator"><span>🟢</span> System Ready</div>
    </div>
    
    <div class="controls">
        <input type="file" id="audioUpload" accept="audio/*" hidden>
        <button onclick="document.getElementById('audioUpload').click()">Зареди MP3/WAV</button>
        <select id="aspectRatio">
            <option value="16:9">16:9 (YouTube)</option>
            <option value="9:16">9:16 (TikTok)</option>
        </select>
        <button id="recordBtn">Започни запис (WebM)</button>
    </div>
    
    <canvas id="visualizerCanvas"></canvas>
    <audio id="audioPlayer" hidden></audio>
</div>

<script>
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioUpload = document.getElementById('audioUpload');
    const recordBtn = document.getElementById('recordBtn');
    
    let audioContext, analyser, source, mediaRecorder, chunks = [];

    function updateCanvasSize() {
        const ratio = document.getElementById('aspectRatio').value;
        if (ratio === '16:9') { canvas.width = 1280; canvas.height = 720; }
        else { canvas.width = 720; canvas.height = 1280; }
    }
    document.getElementById('aspectRatio').onchange = updateCanvasSize;
    updateCanvasSize();

    audioUpload.onchange = function() {
        const file = this.files[0];
        audioPlayer.src = URL.createObjectURL(file);
        audioPlayer.play();
        
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        source = audioContext.createMediaElementSource(audioPlayer);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        analyser.fftSize = 256;
        draw();
    };

    function draw() {
        requestAnimationFrame(draw);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;

        for(let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#7000ff';
            ctx.fillStyle = '#7000ff';
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }

    recordBtn.onclick = () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recordBtn.textContent = "Започни запис (WebM)";
        } else {
            chunks = [];
            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'visualizer_output.webm';
                a.click();
            };
            mediaRecorder.start();
            recordBtn.textContent = "Спри записа";
        }
    };
</script>
</body>
</html>
