<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Suite | Visualizer</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --accent: #7000ff;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-header {
            margin-bottom: 20px;
            text-align: center;
        }
        .status-indicator {
            font-size: 0.85rem;
            color: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .visualizer-container {
            width: 90%;
            max-width: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            flex-wrap: wrap;
        }
        button, select {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #5a00cc;
        }
        #visualizerCanvas {
            width: 100%;
            height: auto;
            background: #000;
            border-radius: 15px;
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <h1>AI Асистент</h1>
        <div class="status-indicator">
            <span class="dot">🟢</span> System Ready
        </div>
    </div>

    <div class="visualizer-container">
        <div class="controls">
            <input type="file" id="audioUpload" accept="audio/*" hidden>
            <button onclick="document.getElementById('audioUpload').click()">Зареди MP3/WAV</button>
            <select id="aspectRatio">
                <option value="16:9">16:9 (YouTube)</option>
                <option value="9:16">9:16 (Shorts)</option>
            </select>
            <button id="recordBtn">Започни запис (WebM)</button>
        </div>
        <canvas id="visualizerCanvas" width="1920" height="1080"></canvas>
    </div>

    <script>
        // Placeholder за бъдеща логика на визуализатора
        console.log("Visualizer Ready");
    </script>
</body>
</html>
