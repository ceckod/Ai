<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Suite - Professional Visualizer</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --accent: #7000ff;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .chat-header {
            text-align: center;
            margin: 20px 0;
        }
        .status-indicator {
            font-size: 0.85rem;
            color: #4CAF50;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-top: -5px;
        }
        .visualizer-container {
            width: 90%;
            max-width: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            justify-content: center;
        }
        button, select {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #5a00cc; transform: scale(1.05); }
        canvas { width: 100%; border-radius: 15px; background: #000; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="chat-header">
    <h1>AI Асистент</h1>
    <div class="status-indicator">
        <span class="dot">🟢</span> System Ready
    </div>
</div>

<div class="visualizer-container">
    <div class="controls">
        <input type="file" id="audioUpload" accept="audio/*" hidden>
        <button onclick="document.getElementById('audioUpload').click()">Зареди MP3/WAV</button>
        <select id="aspectRatio">
            <option value="16:9">16:9 (YouTube)</option>
            <option value="9:16">9:16 (TikTok)</option>
        </select>
        <button id="recordBtn">Започни запис (WebM)</button>
    </div>
    <canvas id="visualizerCanvas" width="1920" height="1080"></canvas>
</div>

<audio id="audioPlayer" hidden></audio>

<script>
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioUpload = document.getElementById('audioUpload');
    const recordBtn = document.getElementById('recordBtn');
    
    let audioContext, analyser, dataArray, source, mediaRecorder, chunks = [];

    audioUpload.onchange = function() {
        const file = this.files[0];
        audioPlayer.src = URL.createObjectURL(file);
        audioPlayer.play();
        
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            source = audioContext.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 512;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            draw();
        }
    };

    function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const barWidth = (canvas.width / dataArray.length) * 2.5;
        let x = 0;
        
        for(let i = 0; i < dataArray.length; i++) {
            const barHeight = dataArray[i] * 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#7000ff';
            ctx.fillStyle = `rgb(112, 0, ${dataArray[i] + 100})`;
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }

    recordBtn.onclick = () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.innerText = 'Започни запис (WebM)';
        } else {
            chunks = [];
            const stream = canvas.captureStream(60);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'visualizer-output.webm';
                a.click();
            };
            mediaRecorder.start();
            recordBtn.innerText = 'Стоп и Експорт';
        }
    };
</script>
</body>
</html>
