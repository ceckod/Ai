<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>AI Music Suite - Professional Visualizer</title>
    <style>
        :root { --bg: #0a0a0c; --panel: rgba(255, 255, 255, 0.05); --accent: #7000ff; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin: 20px 0; }
        .status { font-size: 0.8rem; color: #4CAF50; display: flex; align-items: center; gap: 5px; justify-content: center; }
        .container { width: 90%; max-width: 1000px; background: var(--panel); backdrop-filter: blur(15px); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        button, select { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        canvas { width: 100%; height: auto; background: #000; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Асистент</h1>
        <div class="status">🟢 System Ready</div>
    </div>
    <div class="container">
        <div class="controls">
            <input type="file" id="audioUpload" accept="audio/*" hidden>
            <button onclick="document.getElementById('audioUpload').click()">Зареди MP3/WAV</button>
            <select id="aspectRatio">
                <option value="16:9">16:9 (YouTube)</option>
                <option value="9:16">9:16 (Shorts)</option>
            </select>
            <button id="recordBtn">Започни запис (WebM)</button>
        </div>
        <canvas id="visualizerCanvas" width="1920" height="1080"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const audio = new Audio();
        let audioCtx, analyser, source, mediaRecorder, chunks = [];

        document.getElementById('audioUpload').onchange = (e) => {
            audio.src = URL.createObjectURL(e.target.files[0]);
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 512;
            audio.play();
            draw();
        };

        function draw() {
            requestAnimationFrame(draw);
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 20; ctx.shadowColor = '#7000ff';
            ctx.fillStyle = '#7000ff';
            for(let i=0; i<data.length; i++) {
                let h = (data[i] / 255) * canvas.height * 0.5;
                ctx.fillRect(i * (canvas.width/data.length), canvas.height - h, (canvas.width/data.length)-2, h);
            }
        }

        document.getElementById('recordBtn').onclick = (e) => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                e.target.innerText = "Започни запис (WebM)";
            } else {
                chunks = [];
                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'visualizer.webm';
                    a.click();
                };
                mediaRecorder.start();
                e.target.innerText = "Спри запис";
            }
        };

        document.getElementById('aspectRatio').onchange = (e) => {
            if(e.target.value === '9:16') { canvas.width = 1080; canvas.height = 1920; }
            else { canvas.width = 1920; canvas.height = 1080; }
        };
    </script>
</body>
</html>
