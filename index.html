<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>AI Music Suite - Professional Visualizer</title>
    <style>
        :root { --bg: #0a0a0c; --accent: #7000ff; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin: 20px; }
        .status { font-size: 0.85rem; color: #4CAF50; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px; }
        .container { width: 90%; max-width: 1000px; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        button, select { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        canvas { width: 100%; height: auto; background: #000; border-radius: 15px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <h1>AI Асистент</h1>
    <div class="status"><span>🟢</span> System Ready</div>
</div>

<div class="container">
    <div class="controls">
        <input type="file" id="audioUpload" accept="audio/*" hidden>
        <button onclick="document.getElementById('audioUpload').click()">Зареди Аудио</button>
        <select id="aspectRatio">
            <option value="16:9">16:9 (YouTube)</option>
            <option value="9:16">9:16 (Shorts)</option>
        </select>
        <button id="recBtn">Започни Запис</button>
    </div>
    <canvas id="canvas"></canvas>
</div>

<audio id="audio" hidden></audio>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const audioUpload = document.getElementById('audioUpload');
    const recBtn = document.getElementById('recBtn');
    let audioCtx, analyser, dataArray, source, recorder, chunks = [];

    function setupCanvas() {
        const ratio = document.getElementById('aspectRatio').value;
        canvas.width = 1920;
        canvas.height = ratio === '16:9' ? 1080 : 3413;
    }

    document.getElementById('aspectRatio').onchange = setupCanvas;
    setupCanvas();

    audioUpload.onchange = function() {
        const files = this.files;
        audio.src = URL.createObjectURL(files[0]);
        audio.load();
        if(!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 512;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            draw();
        }
        audio.play();
    };

    function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#7000ff';
        ctx.fillStyle = '#7000ff';

        const barWidth = (canvas.width / dataArray.length) * 2.5;
        for(let i = 0; i < dataArray.length; i++) {
            let barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
        }
    }

    recBtn.onclick = () => {
        if(recorder && recorder.state === "recording") {
            recorder.stop();
            recBtn.innerText = "Започни Запис";
        } else {
            chunks = [];
            recorder = new MediaRecorder(canvas.captureStream(60), { mimeType: 'video/webm' });
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'visualizer.webm';
                a.click();
            };
            recorder.start();
            recBtn.innerText = "Спри Запис";
        }
    };
</script>
</body>
</html>
