<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>AI Music Suite - Extreme Visualizer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: 'Arial Black', sans-serif; }
        #canvas { display: block; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; gap: 15px; background: rgba(0,0,0,0.7); padding: 20px; border-left: 5px solid #00f2ff; }
        button { background: #00f2ff; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="ui">
        <input type="file" id="upload" hidden>
        <button onclick="document.getElementById('upload').click()">Load Track</button>
        <button id="record">Record (WebM)</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let audio, analyser, dataArray, source, audioCtx;
        let recording = false;
        let mediaRecorder, chunks = [];

        document.getElementById('upload').onchange = (e) => {
            if(!audioCtx) audioCtx = new AudioContext();
            audio = new Audio(URL.createObjectURL(e.target.files[0]));
            source = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            audio.play();
            render();
        };

        function render() {
            requestAnimationFrame(render);
            analyser.getByteFrequencyData(dataArray);
            
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0,0, canvas.width, canvas.height);

            const cx = canvas.width/2, cy = canvas.height/2;
            for(let i=0; i<dataArray.length; i++) {
                const r = dataArray[i] * 1.5;
                const angle = i * 0.1;
                ctx.beginPath();
                ctx.strokeStyle = `hsl(${i + Date.now()/50}, 100%, 50%)`;
                ctx.lineWidth = 3;
                ctx.arc(cx, cy, r, angle, angle + 0.2);
                ctx.stroke();
            }
        }

        document.getElementById('record').onclick = (e) => {
            if(!recording) {
                chunks = [];
                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'EXTREME_VISUALS.webm'; a.click();
                };
                mediaRecorder.start();
                e.target.innerText = "Recording...";
                recording = true;
            } else {
                mediaRecorder.stop();
                e.target.innerText = "Record (WebM)";
                recording = false;
            }
        };
    </script>
</body>
</html>
