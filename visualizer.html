<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>AI Music Suite - Cyberpunk Visualizer</title>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .controls { position: absolute; top: 20px; z-index: 10; display: flex; gap: 15px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 50px; border: 1px solid #444; }
        button { background: #ff0055; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        canvas { width: 100vw; height: 100vh; cursor: crosshair; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="file" id="audioUpload" hidden>
        <button onclick="document.getElementById('audioUpload').click()">🎵 Качи песен</button>
        <button id="recordBtn">🔴 Запис</button>
    </div>
    <canvas id="visualizerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let audioCtx, analyser, source, mediaRecorder, chunks = [];
        let particles = [];

        document.getElementById('audioUpload').onchange = (e) => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audio = new Audio(URL.createObjectURL(e.target.files[0]));
            source = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser();
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 512;
            audio.play();
            draw();
        };

        function draw() {
            requestAnimationFrame(draw);
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 15;
            for(let i = 0; i < data.length; i++) {
                const val = data[i];
                const x = (i / data.length) * canvas.width;
                const y = canvas.height - (val * (canvas.height / 255));
                
                ctx.fillStyle = `hsl(${i + 200}, 80%, 60%)`;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(x, y, canvas.width / data.length - 2, val * 2);
            }
        }

        document.getElementById('recordBtn').onclick = (e) => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                e.target.innerText = "🔴 Запис";
            } else {
                chunks = [];
                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(chunks));
                    a.download = 'cyberpunk_viz.webm';
                    a.click();
                };
                mediaRecorder.start();
                e.target.innerText = "⏹ Спри";
            }
        };
    </script>
</body>
</html>
