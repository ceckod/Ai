<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helfi Plastics — График на смени</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #0b1220;
    --surface: #131c2e;
    --surface-2: #1b2740;
    --line: #263252;
    --accent: #4fd1c5;   /* day */
    --amber: #ffb347;
    --night: #0a0e18;    /* night cell */
    --night-text: #cdd6e8;
    --rest: #1b2740;     /* rest cell */
    --text: #e7ecef;
    --text-dim: #8e9bb3;
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header.page {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0;
  }
  .sub {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 4px 0 0;
  }

  /* tabs */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tab {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
  }
  .tab.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(79, 209, 197, 0.08);
  }

  /* month nav */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .month-nav button {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
  }
  .month-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .month-label {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.1rem;
    min-width: 180px;
    text-align: center;
  }

  /* legend */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.day { background: var(--accent); }
  .dot.night { background: #000; border: 1px solid var(--line); }
  .dot.rest { background: var(--rest); border: 1px solid var(--line); }

  /* бързо търсене на смяна */
  .search-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .search-title {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .search-sub {
    color: var(--text-dim);
    font-size: 0.82rem;
    margin: 0 0 14px;
  }
  .search-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-controls select {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: var(--font-body);
    font-size: 0.85rem;
  }
  .search-btn {
    background: var(--accent);
    color: #06201d;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .search-btn:hover { background: #6fe0d5; }
  .search-result {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
  }
  .search-result .res-date {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .result-chip {
    border-radius: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 0.76rem;
  }
  .result-chip .team-name {
    display: block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.86rem;
    margin-bottom: 4px;
  }
  .result-chip.day { background: var(--accent); color: #06201d; border-color: var(--accent); }
  .result-chip.night { background: var(--night); color: var(--night-text); border-color: #000; }
  .result-chip.rest { background: var(--surface-2); color: var(--text-dim); }

  /* grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .dow {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    padding-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .dow.weekend { color: var(--amber); }

  .cell {
    border-radius: 10px;
    padding: 8px 6px;
    min-height: 74px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cell.outside { opacity: 0.25; }
  .cell.searched { box-shadow: 0 0 0 2px var(--accent) inset; }
  .cell .num {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .cell.today .num {
    color: var(--bg);
    background: var(--amber);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  /* single-shift mode cell coloring */
  .cell.day-shift { background: var(--accent); border-color: var(--accent); }
  .cell.day-shift .num, .cell.day-shift .badge { color: #06201d; }
  .cell.night-shift { background: var(--night); border-color: #000; }
  .cell.night-shift .num, .cell.night-shift .badge { color: var(--night-text); }
  .cell.rest-shift { background: var(--surface-2); }

  .badge {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  /* all-shifts mode: mini badges per team */
  .team-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
  .team-chip {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 600;
    padding: 1px 4px;
    border-radius: 4px;
    line-height: 1.4;
  }
  .team-chip.day { background: var(--accent); color: #06201d; }
  .team-chip.night { background: #000; color: var(--night-text); border: 1px solid var(--line); }
  .team-chip.rest { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }

  @media (max-width: 640px) {
    .cell { min-height: 60px; padding: 6px 4px; }
    .dow { font-size: 0.62rem; }
    .team-chip { font-size: 0.56rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>График на смени</h1>
      <p class="sub">Смени А · Б · Ц · Д — ротация на 8 дни</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="dispecher.html" style="color:var(--text-dim);font-size:0.85rem;text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:10px">Диспечер</a>
      <a href="index.html" style="color:var(--text-dim);font-size:0.85rem;text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:10px">← Начало</a>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="month-nav">
    <button id="prevBtn" aria-label="Предишен месец">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn" aria-label="Следващ месец">›</button>
  </div>

  <div class="legend">
    <span><span class="dot day"></span>Дневна</span>
    <span><span class="dot night"></span>Нощна</span>
    <span><span class="dot rest"></span>Почивка</span>
  </div>

  <div class="search-card">
    <h3 class="search-title">Бързо търсене на смяна</h3>
    <p class="search-sub">Избери дата (д/м/г) и виж коя смяна работи дневна, коя нощна и кои почиват.</p>
    <div class="search-controls">
      <select id="searchDay" aria-label="Ден"></select>
      <select id="searchMonth" aria-label="Месец"></select>
      <select id="searchYear" aria-label="Година"></select>
      <button id="searchBtn" class="search-btn">Търси</button>
    </div>
    <div id="searchResult" class="search-result" hidden></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="js/clock.js?v=1787273277"></script>
<script>
  // ------- изчисляване на смените -------
  // База (8-дневен цикъл): Ден,Ден,Почивка,Почивка,Нощ,Нощ,Почивка,Почивка
  // А, Б, Ц, Д са същата база, изместена на 2 дни всяка спрямо предходната.
  const BASE = ["D", "D", "R", "R", "N", "N", "R", "R"];
  const OFFSETS = { "Ц": 0, "А": 2, "Д": 4, "Б": 6 };
  const EPOCH = Date.UTC(2026, 6, 27); // 27 юли 2026 = индекс 0 за Ц
  const DAY_MS = 86400000;

  function shiftType(team, dateUTCms) {
    const daysSince = Math.round((dateUTCms - EPOCH) / DAY_MS);
    const idx = (((daysSince + OFFSETS[team]) % 8) + 8) % 8;
    return BASE[idx];
  }

  const TEAM_ORDER = ["А", "Б", "Ц", "Д"];
  const TYPE_LABEL = { D: "Ден", N: "Нощ", R: "Почивка" };
  const MONTH_NAMES = ["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
  const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

  const DOW_FULL = ["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];

  let currentView = "all"; // "all" | "А" | "Б" | "Ц" | "Д"
  let viewDate = new Date(); // local "today" for cursor
  let searchedKey = null; // "г-м-д" на последно търсената дата, за подсветка в грида

  // ------- тагове -------
  const tabsEl = document.getElementById("tabs");
  function renderTabs() {
    const opts = [["all","Всички"], ["А","Смяна А"], ["Б","Смяна Б"], ["Ц","Смяна Ц"], ["Д","Смяна Д"]];
    tabsEl.innerHTML = "";
    opts.forEach(([key, label]) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (currentView === key ? " active" : "");
      btn.textContent = label;
      btn.onclick = () => { currentView = key; renderTabs(); renderGrid(); };
      tabsEl.appendChild(btn);
    });
  }

  // ------- навигация по месец -------
  document.getElementById("prevBtn").onclick = () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderGrid();
  };
  document.getElementById("nextBtn").onclick = () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderGrid();
  };

  // ------- грид -------
  const gridEl = document.getElementById("grid");
  const monthLabelEl = document.getElementById("monthLabel");

  function renderGrid() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    monthLabelEl.textContent = `${MONTH_NAMES[month]} ${year}`;

    gridEl.innerHTML = "";
    DOW.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "dow" + (i >= 5 ? " weekend" : "");
      el.textContent = d;
      gridEl.appendChild(el);
    });

    const firstOfMonth = new Date(year, month, 1);
    // Monday-start offset
    let startOffset = (firstOfMonth.getDay() + 6) % 7;
    const startDate = new Date(year, month, 1 - startOffset);

    const today = new Date();
    const todayKey = today.toDateString();

    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(startDate);
      cellDate.setDate(startDate.getDate() + i);
      const inMonth = cellDate.getMonth() === month;
      const cellUTC = Date.UTC(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());

      const cell = document.createElement("div");
      cell.className = "cell" + (inMonth ? "" : " outside");
      cell.dataset.date = `${cellDate.getFullYear()}-${cellDate.getMonth()}-${cellDate.getDate()}`;
      if (cellDate.toDateString() === todayKey) cell.classList.add("today");
      if (searchedKey && cell.dataset.date === searchedKey) cell.classList.add("searched");

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = cellDate.getDate();
      cell.appendChild(num);

      if (currentView === "all") {
        const row = document.createElement("div");
        row.className = "team-row";
        TEAM_ORDER.forEach((team) => {
          const t = shiftType(team, cellUTC);
          const chip = document.createElement("span");
          chip.className = "team-chip " + (t === "D" ? "day" : t === "N" ? "night" : "rest");
          chip.textContent = team + (t === "R" ? "" : t === "D" ? "☀" : "☾");
          row.appendChild(chip);
        });
        cell.appendChild(row);
      } else {
        const t = shiftType(currentView, cellUTC);
        cell.classList.add(t === "D" ? "day-shift" : t === "N" ? "night-shift" : "rest-shift");
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.style.marginTop = "auto";
        badge.textContent = TYPE_LABEL[t];
        cell.appendChild(badge);
      }

      gridEl.appendChild(cell);
    }
  }

  // ------- бързо търсене на смяна по дата -------
  const dayEl = document.getElementById("searchDay");
  const monthEl = document.getElementById("searchMonth");
  const yearEl = document.getElementById("searchYear");
  const resultEl = document.getElementById("searchResult");

  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  function populateDays() {
    const y = Number(yearEl.value);
    const m = Number(monthEl.value);
    const count = daysInMonth(y, m);
    const prevVal = Number(dayEl.value) || 1;
    dayEl.innerHTML = "";
    for (let d = 1; d <= count; d++) {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      dayEl.appendChild(opt);
    }
    dayEl.value = Math.min(prevVal, count);
  }

  function populateSearchSelects() {
    MONTH_NAMES.forEach((name, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = name;
      monthEl.appendChild(opt);
    });

    const nowY = new Date().getFullYear();
    for (let y = nowY - 1; y <= nowY + 3; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearEl.appendChild(opt);
    }

    const today = new Date();
    monthEl.value = today.getMonth();
    yearEl.value = today.getFullYear();
    populateDays();
    dayEl.value = today.getDate();
  }

  monthEl.addEventListener("change", populateDays);
  yearEl.addEventListener("change", populateDays);

  document.getElementById("searchBtn").addEventListener("click", () => {
    const d = Number(dayEl.value);
    const m = Number(monthEl.value);
    const y = Number(yearEl.value);
    const dateUTC = Date.UTC(y, m, d);
    const localDow = new Date(y, m, d).getDay();

    resultEl.hidden = false;
    resultEl.innerHTML = "";

    const dateHeader = document.createElement("div");
    dateHeader.className = "res-date";
    dateHeader.textContent = `${d}/${m + 1}/${y} — ${DOW_FULL[localDow]}, ${d} ${MONTH_NAMES[m]} ${y}г.`;
    resultEl.appendChild(dateHeader);

    TEAM_ORDER.forEach((team) => {
      const t = shiftType(team, dateUTC);
      const chip = document.createElement("div");
      chip.className = "result-chip " + (t === "D" ? "day" : t === "N" ? "night" : "rest");
      const label = t === "R" ? "Почивка" : TYPE_LABEL[t] + " смяна";
      chip.innerHTML = `<span class="team-name">Смяна ${team}</span>${label}`;
      resultEl.appendChild(chip);
    });

    // прескочи календара до търсения месец и подсвети деня
    searchedKey = `${y}-${m}-${d}`;
    viewDate = new Date(y, m, 1);
    renderGrid();
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  populateSearchSelects();
  renderTabs();
  renderGrid();
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="js/helfi-core.js?v=1787273277"></script>
<script src="js/sw-register.js?v=1787273277"></script>
<script src="js/agent.js?v=1787273277"></script>
</body>
</html>
