name: Build Android APK (TWA)

# Строи Android приложение (.apk), което зарежда живия сайт,
# без потребителят да вижда браузър. Изисква сайтът вече да е
# публикуван на GitHub Pages и twa-manifest.json да сочи към него.
#
# Преди първо пускане виж README.md → "Android приложение (APK)"
# за еднократната ръчна стъпка (генериране на подписващ ключ +
# GitHub Secrets).

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore

      - name: Build APK from twa-manifest.json
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest ./twa-manifest.json \
            --ksPass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ksKeyPass "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helfy-android-app
          path: app-release-signed.apk
